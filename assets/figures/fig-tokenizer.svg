<rect width="1200" height="600" fill="#F7F5EF"/>
<rect x="0" y="0" width="1200" height="6" fill="#1F5B45"/>
<text x="48" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F5B45">TOKENIZER</text>
<text x="48" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A24">Text becomes subword pieces, then IDs</text>
<line x1="48" y1="122" x2="1152" y2="122" stroke="#C9D2CB" stroke-width="1"/>
<text x="48" y="160" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#6E7A72">原文</text>
<g><rect x="48" y="180" width="1104" height="64" rx="14" fill="#FFFFFF" stroke="#C9D2CB" stroke-width="1.5"/><text x="66" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="650" fill="#1E2A24">unbelievable tokenization</text><text x="66" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A24">两个词，模型并不直接读字符</text></g>
<text x="48" y="292" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#6E7A72">BPE / WordPiece 切成子词</text>
