<text x="48" y="396" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#6E7A72">每个子词映射成一个整数 ID</text>
<g><rect x="48" y="416" width="300" height="78" rx="14" fill="#ECEEE9" stroke="#6E7A72" stroke-width="1.5"/><text x="66" y="448" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24">un → 431</text><text x="66" y="474" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A24">believ → 1207</text></g>
<g><rect x="372" y="416" width="300" height="78" rx="14" fill="#ECEEE9" stroke="#6E7A72" stroke-width="1.5"/><text x="390" y="448" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24">able → 892</text><text x="390" y="474" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A24">token → 15666</text></g>
<g><rect x="696" y="416" width="300" height="78" rx="14" fill="#ECEEE9" stroke="#6E7A72" stroke-width="1.5"/><text x="714" y="448" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24">ization → 3180</text><text x="714" y="474" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A24">长度 5 个 token</text></g>
