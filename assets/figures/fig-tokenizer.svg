<g><rect x="432" y="312" width="170" height="32" rx="16" fill="#F2E4CE" stroke="#A9701F" stroke-width="1"/><text x="517" y="333" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#A9701F" text-anchor="middle">able</text></g>
