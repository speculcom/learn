<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F5B45"/></marker></defs>
<rect width="1200" height="600" fill="#F7F5EF"/>
<rect x="0" y="0" width="1200" height="6" fill="#1F5B45"/>
<text x="48" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F5B45" text-anchor="start">EVALUATION</text>
<text x="48" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A24" text-anchor="start">LLM-as-a-judge, with known biases</text>
<line x1="48" y1="122" x2="1152" y2="122" stroke="#C9D2CB" stroke-width="1"/>

<g><rect x="48" y="160" width="250" height="260" rx="14" fill="#FFFFFF" stroke="#C9D2CB" stroke-width="1.5"/><text x="66" y="192" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24" text-anchor="start">Inputs</text><text x="66" y="218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6E7A72" text-anchor="start">question · answer A · answer B · rubric</text></g>
<g><rect x="370" y="190" width="260" height="200" rx="14" fill="#DCE5EF" stroke="#2C4A6B" stroke-width="1.5"/><text x="388" y="222" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#2C4A6B" text-anchor="start">Judge model</text><text x="388" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#2C4A6B" text-anchor="start">scores or picks a winner</text></g>
<g><rect x="700" y="160" width="200" height="260" rx="14" fill="#DDE9E1" stroke="#1F5B45" stroke-width="1.5"/><text x="718" y="192" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1F5B45" text-anchor="start">Verdict</text><text x="718" y="218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1F5B45" text-anchor="start">score / preference / rationale</text></g>
<g><line x1="298" y1="290" x2="370" y2="290" stroke="#2C4A6B" stroke-width="2.4" marker-end="url(#arr)"/></g>
<g><line x1="630" y1="290" x2="700" y2="290" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/></g>
<g><rect x="930" y="160" width="220" height="260" rx="14" fill="#F2E4CE" stroke="#A9701F" stroke-width="1.5"/><text x="948" y="192" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#A9701F" text-anchor="start">Known biases</text><text x="948" y="218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#A9701F" text-anchor="start">position · verbosity · self-preference</text></g>
<text x="48" y="476" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">Mitigations: randomise order, control for length, use reference answers, and human-review a sample.</text>
<text x="48" y="506" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">A judge score is a noisy proxy, not ground truth.</text>

<text x="48" y="576" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#6E7A72" text-anchor="start">Specul · original diagram · CC BY 4.0</text>
</svg>
