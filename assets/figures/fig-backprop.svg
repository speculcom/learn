<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F5B45"/></marker></defs>
<rect width="1200" height="600" fill="#F7F5EF"/>
<rect x="0" y="0" width="1200" height="6" fill="#1F5B45"/>
<text x="48" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F5B45" text-anchor="start">TRAINING</text>
<text x="48" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A24" text-anchor="start">Forward pass, backward gradients</text>
<line x1="48" y1="122" x2="1152" y2="122" stroke="#C9D2CB" stroke-width="1"/>

<g><rect x="48" y="180" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#C9D2CB" stroke-width="1.5"/><text x="66" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24" text-anchor="start">Input x</text></g>
<g><rect x="288" y="180" width="220" height="100" rx="14" fill="#DCE5EF" stroke="#2C4A6B" stroke-width="1.5"/><text x="306" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#2C4A6B" text-anchor="start">Layer 1</text><text x="306" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#2C4A6B" text-anchor="start">weights W1</text></g>
<g><rect x="558" y="180" width="220" height="100" rx="14" fill="#DCE5EF" stroke="#2C4A6B" stroke-width="1.5"/><text x="576" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#2C4A6B" text-anchor="start">Layer 2</text><text x="576" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#2C4A6B" text-anchor="start">weights W2</text></g>
<g><rect x="828" y="180" width="200" height="100" rx="14" fill="#F2E4CE" stroke="#A9701F" stroke-width="1.5"/><text x="846" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#A9701F" text-anchor="start">Loss</text><text x="846" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#A9701F" text-anchor="start">scalar</text></g>
<g><line x1="238" y1="230" x2="288" y2="230" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/></g><g><line x1="508" y1="230" x2="558" y2="230" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/></g><g><line x1="778" y1="230" x2="828" y2="230" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/></g>
<text x="480" y="160" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1F5B45" text-anchor="middle">forward</text>
<g><line x1="928" y1="320" x2="668" y2="370" stroke="#9C3B2C" stroke-width="2.4" marker-end="url(#arr)"/></g><g><line x1="668" y1="370" x2="398" y2="370" stroke="#9C3B2C" stroke-width="2.4" marker-end="url(#arr)"/></g><g><line x1="398" y1="370" x2="143" y2="320" stroke="#9C3B2C" stroke-width="2.4" marker-end="url(#arr)"/></g>
<text x="480" y="410" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#9C3B2C" text-anchor="middle">backward: chain rule → gradients</text>
<text x="48" y="480" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">Each layer receives d(loss)/d(output) and returns d(loss)/d(input) plus d(loss)/d(weights).</text>
<text x="48" y="510" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">PyTorch autograd records the graph and performs this automatically.</text>

<text x="48" y="576" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#6E7A72" text-anchor="start">Specul · original diagram · CC BY 4.0</text>
</svg>
