<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F5B45"/></marker></defs>
<rect width="1200" height="600" fill="#F7F5EF"/>
<rect x="0" y="0" width="1200" height="6" fill="#1F5B45"/>
<text x="48" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F5B45" text-anchor="start">OBJECTIVE</text>
<text x="48" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A24" text-anchor="start">A loss turns error into a number</text>
<line x1="48" y1="122" x2="1152" y2="122" stroke="#C9D2CB" stroke-width="1"/>

<g><rect x="48" y="180" width="230" height="110" rx="14" fill="#FFFFFF" stroke="#C9D2CB" stroke-width="1.5"/><text x="66" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24" text-anchor="start">Prediction</text><text x="66" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6E7A72" text-anchor="start">model output</text></g>
<g><rect x="48" y="340" width="230" height="110" rx="14" fill="#FFFFFF" stroke="#C9D2CB" stroke-width="1.5"/><text x="66" y="372" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24" text-anchor="start">Target</text><text x="66" y="398" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6E7A72" text-anchor="start">label or next token</text></g>
<g><rect x="360" y="240" width="260" height="150" rx="14" fill="#F2E4CE" stroke="#A9701F" stroke-width="1.5"/><text x="378" y="272" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#A9701F" text-anchor="start">Loss function</text><text x="378" y="298" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#A9701F" text-anchor="start">cross-entropy / MSE</text></g>
<g><rect x="700" y="240" width="200" height="150" rx="14" fill="#DDE9E1" stroke="#1F5B45" stroke-width="1.5"/><text x="718" y="272" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1F5B45" text-anchor="start">Scalar</text><text x="718" y="298" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1F5B45" text-anchor="start">one number</text></g>
<g><rect x="940" y="240" width="210" height="150" rx="14" fill="#DCE5EF" stroke="#2C4A6B" stroke-width="1.5"/><text x="958" y="272" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#2C4A6B" text-anchor="start">Gradient</text><text x="958" y="298" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#2C4A6B" text-anchor="start">to the optimizer</text></g>
<g><line x1="278" y1="235" x2="360" y2="285" stroke="#A9701F" stroke-width="2.4" marker-end="url(#arr)"/></g><g><line x1="278" y1="395" x2="360" y2="350" stroke="#A9701F" stroke-width="2.4" marker-end="url(#arr)"/></g>
<g><line x1="620" y1="315" x2="700" y2="315" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/></g><g><line x1="900" y1="315" x2="940" y2="315" stroke="#2C4A6B" stroke-width="2.4" marker-end="url(#arr)"/></g>
<text x="48" y="500" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">Different tasks need different losses; the choice changes what the model is rewarded for.</text>

