<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F5B45"/></marker></defs>
<rect width="1200" height="600" fill="#F7F5EF"/>
<rect x="0" y="0" width="1200" height="6" fill="#1F5B45"/>
<text x="48" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F5B45">FINE-TUNING</text>
<text x="48" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A24">Adapt a pretrained model without relearning everything</text>
<line x1="48" y1="122" x2="1152" y2="122" stroke="#C9D2CB" stroke-width="1"/>
<g><rect x="48" y="160" width="300" height="120" rx="14" fill="#DCE5EF" stroke="#2C4A6B" stroke-width="1.5"/><text x="66" y="192" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#2C4A6B">Pretrained model</text><text x="66" y="218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#2C4A6B">通用语料上训练好的权重</text></g>
<g><rect x="420" y="160" width="280" height="120" rx="14" fill="#FFFFFF" stroke="#C9D2CB" stroke-width="1.5"/><text x="438" y="192" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24">Task data</text><text x="438" y="218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A24">标注样本 / 指令对</text></g>
<g><rect x="772" y="160" width="380" height="120" rx="14" fill="#DDE9E1" stroke="#1F5B45" stroke-width="1.5"/><text x="790" y="192" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1F5B45">Updated model</text><text x="790" y="218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1F5B45">更贴合任务的权重</text></g>
<line x1="348" y1="220" x2="420" y2="220" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/>
<line x1="700" y1="220" x2="772" y2="220" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="48" y="340" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#6E7A72">两条常见路线</text>
<g><rect x="48" y="360" width="520" height="120" rx="14" fill="#FFFFFF" stroke="#C9D2CB" stroke-width="1.5"/><text x="66" y="392" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24">全量微调</text><text x="66" y="418" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1E2A24">更新全部权重；显存与存储成本最高</text></g>
<g><rect x="600" y="360" width="552" height="120" rx="14" fill="#F2E4CE" stroke="#A9701F" stroke-width="1.5"/><text x="618" y="392" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#A9701F">参数高效微调（LoRA 等）</text><text x="618" y="418" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#A9701F">只训练小适配器；基座冻结</text></g>
<text x="72" y="452" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6E7A72">适合：数据足、要改整体行为</text>
<text x="624" y="452" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#A9701F">适合：多任务切换、显存有限</text>
<text x="48" y="540" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72">微调改变的是权重，不是「把资料存进去」；知识更新仍常靠 RAG。</text>
<text x="48" y="576" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#6E7A72">Specul · original diagram · CC BY 4.0</text>
</svg>