<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F5B45"/></marker></defs>
<rect width="1200" height="600" fill="#F7F5EF"/>
<rect x="0" y="0" width="1200" height="6" fill="#1F5B45"/>
<text x="48" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F5B45" text-anchor="start">PREFERENCE OPTIMISATION</text>
<text x="48" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A24" text-anchor="start">DPO: no reward model in the loop</text>
<line x1="48" y1="122" x2="1152" y2="122" stroke="#C9D2CB" stroke-width="1"/>

<g><rect x="48" y="168" width="300" height="150" rx="14" fill="#DDE9E1" stroke="#1F5B45" stroke-width="1.5"/><text x="66" y="200" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1F5B45" text-anchor="start">Preferred answer</text><text x="66" y="226" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1F5B45" text-anchor="start">chosen by a human</text></g>
<g><rect x="48" y="352" width="300" height="150" rx="14" fill="#F1DDD7" stroke="#9C3B2C" stroke-width="1.5"/><text x="66" y="384" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#9C3B2C" text-anchor="start">Rejected answer</text><text x="66" y="410" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#9C3B2C" text-anchor="start">also human-ranked</text></g>
<g><rect x="466" y="210" width="280" height="240" rx="14" fill="#FFFFFF" stroke="#C9D2CB" stroke-width="1.5"/><text x="484" y="242" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24" text-anchor="start">Policy model</text><text x="484" y="268" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6E7A72" text-anchor="start">same prompt, two completions</text></g>
<g><line x1="348" y1="243" x2="466" y2="280" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/></g>
<g><line x1="348" y1="427" x2="466" y2="380" stroke="#9C3B2C" stroke-width="2.4" marker-end="url(#arr)"/></g>
<g><rect x="864" y="168" width="290" height="150" rx="14" fill="#DDE9E1" stroke="#1F5B45" stroke-width="1.5"/><text x="882" y="200" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1F5B45" text-anchor="start">Loss</text><text x="882" y="226" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1F5B45" text-anchor="start">raise chosen / lower rejected</text></g>
<g><rect x="864" y="352" width="290" height="150" rx="14" fill="#ECEEE9" stroke="#8A938C" stroke-width="1.5"/><text x="882" y="384" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24" text-anchor="start">No reward model</text><text x="882" y="410" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6E7A72" text-anchor="start">no sampling during training</text></g>
<g><line x1="746" y1="300" x2="864" y2="243" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/></g>
<text x="48" y="540" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">DPO turns preference learning into a classification-style loss; PPO-based RLHF still needs a reward model and rollouts.</text>

<text x="48" y="576" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#6E7A72" text-anchor="start">Specul · original diagram · CC BY 4.0</text>
</svg>
