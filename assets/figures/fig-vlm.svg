<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F5B45"/></marker></defs>
<rect width="1200" height="600" fill="#F7F5EF"/>
<rect x="0" y="0" width="1200" height="6" fill="#1F5B45"/>
<text x="48" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F5B45" text-anchor="start">MULTIMODAL</text>
<text x="48" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A24" text-anchor="start">Vision-language model</text>
<line x1="48" y1="122" x2="1152" y2="122" stroke="#C9D2CB" stroke-width="1"/>

<g><rect x="48" y="180" width="200" height="180" rx="14" fill="#ECEEE9" stroke="#8A938C" stroke-width="1.5"/><text x="66" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24" text-anchor="start">Image</text><text x="66" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6E7A72" text-anchor="start">pixels</text></g>
<g><rect x="288" y="180" width="260" height="180" rx="14" fill="#DCE5EF" stroke="#2C4A6B" stroke-width="1.5"/><text x="306" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#2C4A6B" text-anchor="start">Vision encoder</text><text x="306" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#2C4A6B" text-anchor="start">patches → vectors</text></g>
<g><rect x="588" y="180" width="240" height="180" rx="14" fill="#F2E4CE" stroke="#A9701F" stroke-width="1.5"/><text x="606" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#A9701F" text-anchor="start">Projector</text><text x="606" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#A9701F" text-anchor="start">vectors → image tokens</text></g>
<g><rect x="868" y="150" width="280" height="240" rx="14" fill="#DDE9E1" stroke="#1F5B45" stroke-width="1.5"/><text x="886" y="182" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1F5B45" text-anchor="start">Language model</text><text x="886" y="208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1F5B45" text-anchor="start">image tokens + text tokens</text></g>
<g><line x1="248" y1="270" x2="288" y2="270" stroke="#2C4A6B" stroke-width="2.4" marker-end="url(#arr)"/></g><g><line x1="548" y1="270" x2="588" y2="270" stroke="#A9701F" stroke-width="2.4" marker-end="url(#arr)"/></g><g><line x1="828" y1="270" x2="868" y2="270" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/></g>
<text x="48" y="420" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">Text tokens enter directly; image tokens are projected into the same space.</text>
<text x="48" y="450" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">Describing is easy; counting, precise coordinates and small text are not.</text>

<text x="48" y="576" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#6E7A72" text-anchor="start">Specul · original diagram · CC BY 4.0</text>
</svg>
