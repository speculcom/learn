<text x="48" y="500" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">Query enters at the top layer, greedily descends, then scans a small neighbourhood at layer 0.</text>
<text x="48" y="530" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">Trade-off: a small recall loss buys near-logarithmic query time.</text>

