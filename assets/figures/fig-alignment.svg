<text x="72" y="452" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6E7A72">成本高、流程长，但可控</text>
<text x="624" y="452" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1F5B45">更简单，但对偏好数据质量敏感</text>
<text x="48" y="540" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72">偏好对齐优化的是「更像人想要的选择」，不等于事实正确或安全。</text>
