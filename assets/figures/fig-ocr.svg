<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F5B45"/></marker></defs>
<rect width="1200" height="600" fill="#F7F5EF"/>
<rect x="0" y="0" width="1200" height="6" fill="#1F5B45"/>
<text x="48" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F5B45" text-anchor="start">DOCUMENT AI</text>
<text x="48" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A24" text-anchor="start">OCR is a pipeline, not a step</text>
<line x1="48" y1="122" x2="1152" y2="122" stroke="#C9D2CB" stroke-width="1"/>

<g><rect x="48" y="150" width="250" height="280" rx="14" fill="#ECEEE9" stroke="#8A938C" stroke-width="1.5"/><text x="66" y="182" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24" text-anchor="start">Scan</text><text x="66" y="208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6E7A72" text-anchor="start">photo or PDF page</text></g>
<rect x="72" y="210" width="200" height="10" rx="3" fill="#C9D2CB"/><rect x="72" y="264" width="200" height="10" rx="3" fill="#C9D2CB"/><rect x="72" y="318" width="200" height="10" rx="3" fill="#C9D2CB"/>
<rect x="72" y="270" width="60" height="10" rx="3" fill="#DCE5EF"/><rect x="72" y="292" width="150" height="10" rx="3" fill="#DCE5EF"/><rect x="72" y="314" width="60" height="10" rx="3" fill="#DCE5EF"/><rect x="72" y="336" width="150" height="10" rx="3" fill="#DCE5EF"/>
<g><rect x="330" y="150" width="230" height="280" rx="14" fill="#DCE5EF" stroke="#2C4A6B" stroke-width="1.5"/><text x="348" y="182" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#2C4A6B" text-anchor="start">Layout</text><text x="348" y="208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#2C4A6B" text-anchor="start">columns · tables · headers</text></g>
<g><rect x="592" y="150" width="230" height="280" rx="14" fill="#DDE9E1" stroke="#1F5B45" stroke-width="1.5"/><text x="610" y="182" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1F5B45" text-anchor="start">Detect + read</text><text x="610" y="208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1F5B45" text-anchor="start">boxes → characters</text></g>
<g><rect x="854" y="150" width="300" height="280" rx="14" fill="#FFFFFF" stroke="#C9D2CB" stroke-width="1.5"/><text x="872" y="182" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#1E2A24" text-anchor="start">Text + confidence</text><text x="872" y="208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#6E7A72" text-anchor="start">low-confidence regions flagged</text></g>
<g><line x1="298" y1="290" x2="330" y2="290" stroke="#2C4A6B" stroke-width="2.4" marker-end="url(#arr)"/></g><g><line x1="560" y1="290" x2="592" y2="290" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/></g><g><line x1="822" y1="290" x2="854" y2="290" stroke="#1F5B45" stroke-width="2.4" marker-end="url(#arr)"/></g>
<text x="48" y="480" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">Tables need their row/column structure preserved; flattening them into text destroys meaning.</text>
<text x="48" y="510" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">Measure character error rate on 30 real pages before trusting the output.</text>

<text x="48" y="576" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#6E7A72" text-anchor="start">Specul · original diagram · CC BY 4.0</text>
</svg>
