<text x="672" y="380" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#A9701F" text-anchor="start">top 5 kept · order matters</text>
<g><line x1="568" y1="280" x2="632" y2="280" stroke="#A9701F" stroke-width="2.4" marker-end="url(#arr)"/></g>
<text x="48" y="470" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">Why not rerank everything? A cross-encoder scores each pair separately, so cost grows with candidates.</text>
<text x="48" y="500" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#6E7A72" text-anchor="start">Typical recipe: recall 50–200, rerank to 3–10, then generate.</text>

