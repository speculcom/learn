<rect width="1200" height="600" fill="#F7F5EF"/>
<rect x="0" y="0" width="1200" height="6" fill="#1F5B45"/>
<text x="48" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F5B45" text-anchor="start">TWO-STAGE RETRIEVAL</text>
<text x="48" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A24" text-anchor="start">Recall wide, rerank precise</text>
<line x1="48" y1="122" x2="1152" y2="122" stroke="#C9D2CB" stroke-width="1"/>

<g><rect x="48" y="156" width="520" height="250" rx="14" fill="#DCE5EF" stroke="#2C4A6B" stroke-width="1.5"/><text x="66" y="188" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#2C4A6B" text-anchor="start">Stage 1 · Recall</text><text x="66" y="214" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#2C4A6B" text-anchor="start">fast and approximate</text></g>
<circle cx="90" cy="255" r="10" fill="#2C4A6B"/><circle cx="136" cy="273" r="10" fill="#2C4A6B"/><circle cx="182" cy="291" r="10" fill="#2C4A6B"/><circle cx="228" cy="255" r="10" fill="#2C4A6B"/><circle cx="274" cy="273" r="8" fill="#B9CBDD"/><circle cx="320" cy="291" r="8" fill="#B9CBDD"/><circle cx="366" cy="255" r="8" fill="#B9CBDD"/><circle cx="412" cy="273" r="8" fill="#B9CBDD"/><circle cx="458" cy="291" r="8" fill="#B9CBDD"/><circle cx="504" cy="255" r="8" fill="#B9CBDD"/>
<text x="88" y="360" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#2C4A6B" text-anchor="start">candidates 1..100</text>
<g><rect x="632" y="156" width="520" height="250" rx="14" fill="#F2E4CE" stroke="#A9701F" stroke-width="1.5"/><text x="650" y="188" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="650" fill="#A9701F" text-anchor="start">Stage 2 · Rerank</text><text x="650" y="214" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#A9701F" text-anchor="start">cross-encoder reads query + passage</text></g>
