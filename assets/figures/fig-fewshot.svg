<text x="656" y="226" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1E2A24" text-anchor="start">Input: “Fast and stable.” → pos</text><text x="656" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1E2A24" text-anchor="start">Input: “Login is broken.” → neg</text><text x="656" y="298" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#1E2A24" text-anchor="start">Input: “Works, but slow.” → mixed</text>
